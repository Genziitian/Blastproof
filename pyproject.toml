[project]
name = "blast-radius"
version = "0.1.0"
description = "On-call agents with graph memory on FalkorDB (Graph Hacks 2026, Track 02)"
requires-python = ">=3.10"
dependencies = [
    "falkordb",
    "mcp",
]

[project.optional-dependencies]
ui = ["fastapi", "uvicorn"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "bench", "chat", "common", "coord", "eval", "memory", "scripts", "sim", "tools"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
