  $("#reset").onclick = async (e) => {
    if (e.target.dataset.sure !== "1") { e.target.dataset.sure = "1"; e.target.textContent = "Click again to reset"; return; }
    d.hidden = true; await api("/api/reset", {}); S.selected = null; S.inc = null; S.seen.clear(); S.follow = true;
    await Promise.all([loadMap(), loadMemory()]); await pollState(); await pollIncident(); toast("company_a reset to the seeded company.");
  };
}
$("#dir-btn").onclick = (e) => { e.stopPropagation(); const d = $("#director"); d.hidden = !d.hidden; renderDirector(); };
$("#director").onclick = (e) => e.stopPropagation();
document.addEventListener("click", () => { $("#director").hidden = true; });

/* ------------------------------------------------------------ cypher drawer */
const CYPHER = {
  graph: ["Dependency graph", "The graph panel, and the walks agents run over it to recall memory.",
    [["this panel", "web/queries/service_map.cypher"], ["recall: walk downstream from the alerts", "memory/queries/recall.cypher"],
     ["recall: same kind of datastore", "memory/queries/recall_kind.cypher"], ["blast radius", "tools/queries/blast_radius.cypher"]]],
  lens: ["What happened", "Every memory considered, why, the evidence, and what changed afterwards.",
    [["memory lens", "web/queries/lens.cypher"], ["what the investigator recalled (fenced)", "agents/queries/record_recall.cypher"],
     ["each use, written by the investigator", "agents/queries/record_usage.cypher"], ["trust after the verdict", "memory/queries/feedback.cypher"]]],
  timeline: ["Agent timeline", "Tasks, claims, checkpoints and handoffs.",
    [["tasks", "web/queries/tasks.cypher"], ["checkpoints", "web/queries/checkpoints.cypher"], ["claim: new fencing epoch, DB clock", "coord/queries/claim.cypher"],
     ["fenced checkpoint", "coord/queries/checkpoint.cypher"], ["handoff to the next agent", "coord/queries/handoff.cypher"]]],
  agents: ["Agents", "Agents share nothing but these queries: a lease, a heartbeat, a fenced write.",
    [["claim", "coord/queries/claim.cypher"], ["heartbeat", "coord/queries/heartbeat.cypher"], ["fenced checkpoint", "coord/queries/checkpoint.cypher"],
     ["send exactly once per intent", "coord/queries/send_action.cypher"]]],
  org: ["On call", "Who to page, at scenario time.",
    [["this panel", "web/queries/org.cypher"], ["who to page", "tools/queries/who_to_page.cypher"]]],
  memory: ["Playbooks", "What the agents remembered.",
    [["playbooks", "web/queries/playbooks.cypher"], ["a new playbook from a confirmed incident", "memory/queries/write_playbook.cypher"], ["trust after the verdict", "memory/queries/feedback.cypher"]]],
  prefs: ["Engineer preferences", "Facts are superseded, never edited.",
    [["facts", "web/queries/facts.cypher"], ["supersede a fact", "memory/queries/fact_supersede.cypher"], ["preferences in force", "chat/queries/preferences_for.cypher"],
     ["war-room messages", "web/queries/messages.cypher"]]],
};
function highlight(text) {
  return text.split("\n").map((line) => {
    if (line.trim().startsWith("//")) return `<span class="c">${esc(line)}</span>`;
    return esc(line).replace(/\$[A-Za-z_]\w*/g, (m) => `<span class="p">${m}</span>`)
      .replace(/\b(OPTIONAL MATCH|MATCH|WHERE|RETURN|WITH|SET|MERGE|CREATE|ON CREATE SET|ON MATCH SET|UNWIND|ORDER BY|LIMIT|AS|AND|OR|NOT|IN|IS NULL|IS NOT NULL|CASE|WHEN|THEN|ELSE|END|DISTINCT|DESC|ASC|CALL|YIELD|DELETE|DETACH)\b/g, (m) => `<span class="k">${m}</span>`)
      .replace(/\(([a-z]\w*)?(:[A-Z]\w*(?::[A-Z]\w*)*)/g, (m, v, l) => `(${v || ""}<span class="l">${l}</span>`)
      .replace(/\[(\w*)?(:[A-Z_]+)/g, (m, v, l) => `[${v || ""}<span class="l">${l}</span>`);
  }).join("\n");
}
async function showCypher(key, i = 0) {
  const [title, why, files] = CYPHER[key];
  $("#dr-title").textContent = title; $("#dr-why").textContent = why;
  $("#dr-files").innerHTML = files.map(([l], j) => `<button class="${j === i ? "on" : ""}" data-f="${j}">${esc(l)}</button>`).join("");
  $("#dr-files").querySelectorAll("[data-f]").forEach((b) => b.onclick = () => showCypher(key, +b.dataset.f));
  const r = await api(`/api/cypher?path=${encodeURIComponent(files[i][1])}`);
  $("#dr-path").textContent = r.path; $("#dr-text").innerHTML = highlight(r.text);
  const db = S.inc?.db;
  $("#dr-foot").innerHTML = `${db && S.tab === "live" ? `This incident view: ${db.queries} Cypher queries, ${db.ms} ms in FalkorDB, every refresh. ` : ""}Try it in the
    <a href="http://localhost:3000" target="_blank" rel="noopener">FalkorDB Browser</a> on graph <span class="mono">${esc(S.settings.graph)}</span>.`;
  $("#drawer").classList.add("on");
}
function bindQ(root) { root.querySelectorAll("[data-q]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); showCypher(b.dataset.q); }); }
$("#dr-close").onclick = () => $("#drawer").classList.remove("on");
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { $("#drawer").classList.remove("on"); $("#director").hidden = true; closeNodePop(); } });

/* ------------------------------------------------------------ restart */
function setDbDown(down) {
  if (down === S.dbDown) { if (down) updateDbDown(); return; }
  S.dbDown = down;
  if (down) { S.dbSince = Date.now(); updateDbDown(); }
  else {
    $("#dbdown").innerHTML = "";
    $("#dbdot").style.background = ""; $("#dbtext").textContent = "· connected";
    // the proof: what is still there after the restart, read back from the graph
    Promise.all([api("/api/memory"), api("/api/state")]).then(([m, st]) => {
      S.memory = m; S.state = st;
      const pb = m.playbooks.filter((p) => p.status === "active").length;
      const inc = st.incidents.filter((i) => i.status !== "planted").length;
      toast(`<b>Memory survived the restart:</b> ${plural(pb, "playbook")}, ${plural(inc, "incident")}, ${plural(m.facts.filter((f) => !f.valid_to).length, "preference")}.`, 6000);
    }).catch(() => {});
  }
  renderStageBits();
}
function updateDbDown() {
  $("#dbdot").style.background = "var(--amb)"; $("#dbtext").textContent = "· reconnecting";
  const s = Math.round((Date.now() - S.dbSince) / 1000);
  $("#dbdown").innerHTML = `<div class="dbdown"><div><b>FalkorDB restarting…</b><span>The agents are waiting. Nothing is lost · ${s} s</span></div></div>`;
}

/* ------------------------------------------------------------ polling */
async function breakIt(body) {
  const r = await api("/api/break", body);
  S.selected = r.key; S.follow = true; S.inc = null; S.rail = "story";
  await pollState(); await pollIncident();
}
async function pollState() {
  S.state = await api("/api/state");
  const list = S.state.incidents;
  if (S.follow && list.length && list[0].key !== S.selected) { S.selected = list[0].key; S.inc = null; }
  if (!S.selected && list.length) S.selected = list[0].key;
  if (S.selected && !list.find((i) => i.key === S.selected)) { S.selected = list[0]?.key || null; S.inc = null; }
  if (!$("#director").hidden && document.activeElement?.id !== "arm-step") renderDirector();
}
async function pollIncident() {
  if (S.selected) {
    try { S.inc = await api(`/api/incident/${encodeURIComponent(S.selected)}`); }
    catch (e) { if (!S.dbDown) { S.inc = null; S.selected = null; } }
  } else S.inc = null;
  render();
}
function render() {
  S.story = S.inc ? storyOf(S.inc) : null;
  if (S.tab === "live") { renderGraph(); renderStageBits(); renderRailHead(); renderRail(); renderAgents(); renderScrub(); }
  if (S.tab === "memory") renderMemory();
}
async function loadMap() { S.map = await api("/api/map"); $("#graph").dataset.sig = ""; render(); }
async function loadMemory() { S.memory = await api("/api/memory"); render(); }
async function loadDb() { S.db = await api("/api/db"); $("#dbver").textContent = `FalkorDB ${S.db.version || ""}`; $("#dbstat").title = `${S.db.graph}: ${S.db.nodes} nodes, ${S.db.edges} edges. Open the FalkorDB Browser.`; }

document.querySelectorAll(".tab").forEach((b) => b.onclick = () => {
  S.tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
  for (const v of ["live", "memory", "results"]) $("#view-" + v).hidden = v !== S.tab;
  if (S.tab === "results") renderResults().catch(() => {});
  if (S.tab === "live") { $("#graph").dataset.sig = ""; }
  render();
});

async function boot() {
  bindQ(document);
  S.settings = await api("/api/settings");
  $("#hdr-co").textContent = S.settings.graph;
  const ms = S.settings.model_status || "";
  const bad = ms.startsWith("unavailable");
  $("#hdr-model").textContent = bad ? `${S.settings.model} unavailable · rule-based` : S.settings.model;
  $("#hdr-model").className = "model" + (bad ? " bad" : ""); if (bad) $("#hdr-model").title = ms;
  const t = S.settings;
  $("#hdr-timing").textContent = t.timing_profile === "demo" ? "demo timing" : `lease ${t.lease_ms / 1000} s`;
  $("#hdr-timing").title = `lease ${t.lease_ms / 1000} s, heartbeat ${t.heartbeat_ms / 1000} s${t.timing_profile === "demo" ? " (production: 30 s / 10 s)" : ""}`;
  $("#dbtext").textContent = "· connected";
  await Promise.all([api("/api/map").then((m) => S.map = m), api("/api/memory").then((m) => S.memory = m).catch(() => {}), loadDb().catch(() => {})]);
  await pollState(); await pollIncident();
  // everything already in the graph at load time is shown in its final state
  S.booted = true;
  const loop = async (fn, ms) => { try { await fn(); } catch (e) { /* shown already */ } setTimeout(() => loop(fn, ms), S.dbDown ? 1000 : ms); };
  setTimeout(() => loop(pollState, 1000), 1000);
  setTimeout(() => loop(pollIncident, 600), 600);
  setTimeout(() => loop(async () => { S.memory = await api("/api/memory"); S.map = await api("/api/map"); await loadDb(); render(); }, 3000), 3000);
}
boot();

</script>
