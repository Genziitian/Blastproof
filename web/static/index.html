<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blast Radius</title>
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(/fonts/inter-400.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: Inter; font-weight: 500; src: url(/fonts/inter-500.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: Inter; font-weight: 600; src: url(/fonts/inter-600.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: Inter; font-weight: 700; src: url(/fonts/inter-700.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url(/fonts/jetbrains-mono-400.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url(/fonts/jetbrains-mono-500.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "JetBrains Mono"; font-weight: 600; src: url(/fonts/jetbrains-mono-600.woff2) format("woff2"); font-display: swap; }

:root {
  --bg: #0a0a0b; --bg2: #0f0f11; --card: #111113; --card2: #141416; --hover: #1c1c1f;
  --line: #1d1d21; --line2: #2a2a2f; --line3: #3a3a40;
  --t1: #ededee; --t2: #a1a1a9; --t3: #6e6e76; --t4: #5a5a62;
  --acc: #62c9d3; --red: #ef5b5b; --amb: #e9a23b; --grn: #3fcf8e;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--t1);
  font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--acc); text-decoration: none; }
.mono { font-family: var(--mono); }
[hidden] { display: none !important; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #26262b; border-radius: 4px; }

/* ---------- top bar */
header { height: 56px; display: flex; align-items: center; gap: 28px; padding: 0 24px;
  border-bottom: 1px solid var(--line); position: relative; z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand .logo { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--acc); display: grid; place-items: center; }
.brand .logo i { width: 5px; height: 5px; border-radius: 50%; background: var(--acc); }
.brand b { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.brand .sep { color: var(--line3); }
.brand .co { font: 500 13px var(--mono); color: var(--t2); }
.tabs { display: flex; gap: 2px; }
.tab { border: 0; background: transparent; color: var(--t3); padding: 7px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; }
.tab:hover { color: var(--t2); } .tab.on { color: var(--t1); background: var(--hover); }
.grow { flex: 1; }
.status { display: flex; align-items: center; gap: 20px; font-size: 13px; color: var(--t2); white-space: nowrap; }
.dbstat { display: flex; align-items: center; gap: 8px; }
.dbstat .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--grn); transition: background .3s; }
.dbstat b { font: 500 12px var(--mono); color: #c8c8ce; }
.model { font: 400 12px var(--mono); color: var(--t3); }
.model.bad { color: var(--red); }
.tag { font-size: 11px; color: var(--t2); border: 1px solid var(--line3); border-radius: 4px; padding: 1px 6px; }
.btn { border: 1px solid var(--line2); background: transparent; color: var(--t1); border-radius: 7px; padding: 6px 12px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--t1); color: #0a0a0b; border-color: var(--t1); }
.btn.primary:hover { background: #fff; }
.btn.danger { color: var(--red); border-color: rgba(239,91,91,.35); }
.btn.small { padding: 3px 9px; font-size: 12px; border-radius: 6px; }
.btn:disabled { opacity: .45; cursor: default; }
.qbtn { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line2); background: transparent; color: var(--t3);
  display: inline-grid; place-items: center; font: 600 11px var(--mono); padding: 0; flex: none; }
.qbtn:hover { color: var(--acc); border-color: rgba(98,201,211,.5); }

/* ---------- director popover */
.pop { position: absolute; top: 50px; right: 20px; width: 360px; background: #121214; border: 1px solid var(--line2);
  border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.6); padding: 8px; z-index: 40;
  animation: up .2s var(--ease) both; max-height: calc(100vh - 70px); overflow: auto; }
.pop h4 { margin: 10px 10px 6px; font-size: 11px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: .06em; }
.pop .sc { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; }
.pop .sc:hover { background: var(--hover); }
.pop .sc b { font: 500 12px var(--mono); color: var(--acc); }
.pop .row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; font-size: 13px; }
.pop .row label { flex: 1; color: var(--t1); }
.pop .hint { padding: 0 10px 6px; font-size: 12px; color: var(--t3); }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.toggle { width: 32px; height: 18px; border-radius: 9px; background: #2e2e33; border: 0; position: relative; flex: none; transition: background .2s; }
.toggle i { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .2s var(--ease); }
.toggle.on { background: var(--acc); } .toggle.on i { left: 16px; }
select.sel, input.num { background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 3px 6px; font-size: 12px; }
input.num { width: 48px; font-family: var(--mono); }

/* ---------- live layout */
#view-live { height: calc(100vh - 56px); min-height: 760px; display: grid;
  grid-template-columns: minmax(0, 1fr) 640px; grid-template-rows: minmax(0, 1fr) auto auto; }
.stage { position: relative; border-right: 1px solid var(--line); min-height: 0; overflow: hidden; }
.stage-head { position: absolute; left: 24px; right: 24px; top: 18px; display: flex; align-items: center; gap: 10px; z-index: 3; }
.stage-head .h { font-size: 13px; font-weight: 600; }
.stage-head .sub { font-size: 13px; color: var(--t3); }
.oncall { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--t3); }
.avatar { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #2e2e33; display: grid; place-items: center;
  font: 600 10px Inter, sans-serif; color: var(--t2); background: var(--card); transition: border-color .3s, color .3s, box-shadow .3s; }
.avatar.hot { border-color: var(--t1); color: var(--t1); box-shadow: 0 0 0 3px rgba(237,237,238,.12); }
.notif { font-size: 12px; font-weight: 500; color: var(--t1); border: 1px solid var(--line2); border-radius: 999px; padding: 2px 10px; animation: fade .3s both; }
#graph { position: absolute; inset: 56px 16px 84px 16px; }
#graph svg { width: 100%; height: 100%; overflow: visible; }
.edge { fill: none; stroke: #26262b; stroke-width: 1.2; transition: stroke .3s, opacity .3s; }
.dim .edge { opacity: .5; }
.rp { fill: none; stroke-linecap: round; }
.rp.main { stroke: var(--acc); stroke-width: 2; }
.rp.faint { stroke: rgba(98,201,211,.5); stroke-width: 1.4; stroke-dasharray: 3 4; }
.rp.ruled { stroke: #55555c; stroke-width: 1.4; stroke-dasharray: 3 4; }
.rp.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--d, .8s) var(--ease) forwards; }
.rp.faint.draw, .rp.ruled.draw { stroke-dasharray: 1; }
.node rect.box { transition: fill .3s, stroke .3s; }
.node text { font: 500 13px var(--mono); fill: #d8d8dc; transition: fill .3s; pointer-events: none; }
.node { cursor: pointer; transition: opacity .3s; }
.node.faded { opacity: .38; }
.node:hover rect.box { stroke: #55555c; }
.node .cap { font: 400 12px Inter, sans-serif; fill: var(--t2); }
.ring { fill: none; stroke-width: 4; }
.pulse { fill: none; stroke: var(--red); stroke-width: 2; transform-box: fill-box; transform-origin: center;
  animation: pulse .55s var(--ease) var(--delay, 0s) 2 both; }
.pin rect { fill: #0f1415; stroke: rgba(98,201,211,.6); }
.pin text { font: 500 11px var(--mono); fill: var(--acc); }
.pin circle { fill: var(--acc); }
.pin.grn rect { stroke: rgba(63,207,142,.6); } .pin.grn text { fill: var(--grn); } .pin.grn circle { fill: var(--grn); }
.pin.neu rect { stroke: var(--line3); } .pin.neu text { fill: var(--t2); } .pin.neu circle { fill: var(--t2); }
.pin.ret rect { stroke: #2e2e33; } .pin.ret text { fill: var(--t4); } .pin.ret circle { fill: var(--t4); }
.pin.pop-in { animation: pinIn .4s var(--ease) both; }
.plabel { font: 500 12px var(--mono); fill: var(--acc); }
.plabel.ruled { fill: var(--t3); }
.travel { fill: var(--acc); }
.checkcard { background: #141416; border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.5);
  font-size: 13px; overflow: hidden; animation: card .3s var(--ease) both; }
.checkcard .hd { padding: 11px 14px 9px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
.checkcard .hd b { font-weight: 600; } .checkcard .hd .s { font-size: 12px; color: var(--t3); }
.checkcard .hd .n { margin-left: auto; font: 500 12px var(--mono); color: var(--t2); }
.crow { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); }
.crow:first-of-type { border-top: 0; }
.crow .o { font: 400 12px var(--mono); color: var(--t3); margin-top: 1px; }
.crow.new { animation: fade .3s var(--ease) both; }
.glyph { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid; display: grid; place-items: center; font-size: 9px; font-weight: 700; margin-top: 2px; }
.g-pass { border-color: var(--grn); color: var(--grn); }
.g-fail { border-color: var(--red); color: var(--red); }
.g-pend { border-color: var(--amb); }
.g-wait { border-color: #2e2e33; }
.cmsg { padding: 9px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--t2); background: #121214; }
.stage-event { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); z-index: 4; display: flex; gap: 10px; align-items: center;
  background: #141416; border: 1px solid var(--line2); border-radius: 999px; padding: 6px 14px 6px 6px; font-size: 13px; animation: fade .3s both; white-space: nowrap; }
.kbadge { font: 600 11px var(--mono); color: var(--t2); background: #1c1c1f; border-radius: 999px; padding: 2px 8px; }
.caption { position: absolute; left: 24px; bottom: 18px; max-width: min(1000px, calc(100% - 48px)); z-index: 3;
  background: #141416; border: 1px solid var(--line2); border-radius: 12px; padding: 13px 20px; display: flex; gap: 14px; align-items: baseline;
  animation: cap .3s var(--ease) both; }
.caption span { font-size: 21px; font-weight: 500; letter-spacing: -.01em; text-wrap: pretty; }
.legend { position: absolute; right: 24px; bottom: 26px; display: flex; gap: 16px; font-size: 12px; color: var(--t3); z-index: 2; }
.legend i { display: inline-block; vertical-align: -1px; margin-right: 6px; width: 14px; height: 10px; border: 1px solid #3a3a40; }
.envelope { position: fixed; z-index: 50; width: 22px; height: 16px; pointer-events: none; transition: transform 1s var(--ease), opacity .3s; }

/* node popover */
.npop { position: absolute; z-index: 6; width: 290px; background: #141416; border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px;
  box-shadow: 0 16px 40px rgba(0,0,0,.5); font-size: 13px; animation: card .2s var(--ease) both; }
.npop .t { font: 600 13px var(--mono); }
.npop .m { color: var(--t3); font-size: 12px; margin: 2px 0 10px; }
.npop .r { display: flex; gap: 8px; align-items: center; margin-top: 8px; }

/* db down */
.dbdown { position: absolute; inset: 0; background: rgba(10,10,11,.78); z-index: 8; display: grid; place-items: center; animation: fade .3s both; }
.dbdown div { text-align: center; } .dbdown b { font-size: 22px; font-weight: 500; display: block; margin-bottom: 6px; }
.dbdown span { color: var(--t2); font-size: 14px; }
.toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 60; background: #141416; border: 1px solid var(--line2);
  border-radius: 12px; padding: 12px 18px; font-size: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.5); animation: up .3s var(--ease) both; max-width: 640px; }
.toast b { color: var(--grn); font-weight: 600; }

/* ---------- rail */
.rail { display: flex; flex-direction: column; min-height: 0; }
.rail-head { padding: 22px 28px 16px; border-bottom: 1px solid var(--line); }
.rail-head .meta { display: flex; align-items: center; gap: 10px; }
.incpick { background: transparent; border: 0; color: var(--t3); font: 400 12px var(--mono); padding: 0; cursor: pointer; }
.incpick option { background: #141416; color: var(--t1); }
.badge { font-size: 12px; font-weight: 500; padding: 1px 7px; border-radius: 5px; background: #1c1c1f; color: var(--t2); white-space: nowrap; }
.badge.amb { background: rgba(233,162,59,.13); color: var(--amb); }
.badge.grn { background: rgba(63,207,142,.12); color: var(--grn); }
.badge.red { background: rgba(239,91,91,.12); color: var(--red); }
.badge.acc { background: rgba(98,201,211,.12); color: var(--acc); }
.badge.mono { font-family: var(--mono); font-size: 11px; }
.rail-head h1 { margin: 10px 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -.015em; }
.rail-head .alerts { font-size: 13px; color: var(--t2); }
.seg { display: inline-flex; gap: 2px; background: #121214; border: 1px solid var(--line); border-radius: 8px; padding: 2px; margin-top: 14px; }
.seg button { border: 0; background: transparent; color: var(--t3); font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 6px; }
.seg button.on { background: var(--hover); color: var(--t1); }
.rail-body { flex: 1; overflow: auto; padding: 18px 28px 24px; min-height: 0; }

/* stepper */
.steps { position: relative; }
.step { display: grid; grid-template-columns: 22px 1fr auto; column-gap: 14px; position: relative; padding-bottom: 18px; }
.step::before { content: ""; position: absolute; left: 10.5px; top: 24px; bottom: 0; width: 1px; background: var(--lc, #222226); }
.step:last-child::before { display: none; }
.step .mk { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid; display: grid; place-items: center; font-size: 10px; font-weight: 600;
  transition: all .3s var(--ease); background: var(--bg); position: relative; z-index: 1; }
.step .ti { font-size: 15px; padding-top: 1px; cursor: default; }
.step.has .ti { cursor: pointer; }
.step .tm { font: 400 12px var(--mono); color: var(--t3); padding-top: 3px; }
.step .body { grid-column: 2 / 4; margin-top: 8px; }
.step.new .ti { animation: fade .4s var(--ease) both; }
.s-done .mk { border-color: var(--line3); color: var(--t1); background: #1a1a1d; }
.s-current .mk { border-color: var(--amb); color: var(--amb); background: rgba(233,162,59,.14); }
.s-current .mk::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--amb); }
.s-pending .mk { border-color: #2a2a2f; color: var(--t4); }
.s-pending .ti { color: var(--t4); }
.s-ok .mk { border-color: rgba(63,207,142,.75); color: var(--grn); background: rgba(63,207,142,.12); }
.s-ruled .mk { border-color: var(--line3); color: var(--t2); background: #1a1a1d; }
.s-ruled .ti { color: var(--t2); }
.s-bad .mk { border-color: rgba(239,91,91,.75); color: var(--red); background: rgba(239,91,91,.12); }
.s-done .ti, .s-ok .ti { font-weight: 500; } .s-current .ti { font-weight: 600; }
.kv { border: 1px solid var(--line); background: var(--bg2); border-radius: 8px; padding: 10px 14px; display: grid; grid-template-columns: 150px 1fr; gap: 6px 16px;
  font: 400 12.5px var(--mono); }
.kv .k { color: var(--t3); } .kv .v { color: var(--t1); overflow-wrap: anywhere; }
.note { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line2); background: #141416; border-radius: 7px; padding: 4px 10px; font-size: 13px; margin-bottom: 8px; }
.note b { font: 600 11px var(--mono); color: var(--amb); }
.lens { border: 1px solid var(--line); background: var(--bg2); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
.lens .lh { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; flex-wrap: wrap; }
.lens .lh b { font: 500 12.5px var(--mono); }
.lens .q { display: grid; grid-template-columns: 120px 1fr; gap: 8px 14px; padding: 10px 14px; font-size: 13px; }
.lens .q .k { color: var(--t3); font-size: 12px; padding-top: 1px; }
.lens .ck { display: grid; grid-template-columns: 18px 1fr; gap: 8px; margin-bottom: 6px; }
.lens .ck .o { font: 400 11.5px var(--mono); color: var(--t3); }
.trustbar { display: inline-block; width: 70px; height: 4px; border-radius: 2px; background: #222226; vertical-align: middle; margin-left: 8px; overflow: hidden; }
.trustbar i { display: block; height: 100%; background: var(--t2); border-radius: 2px; transition: width .6s var(--ease); }
.msgs { display: grid; gap: 8px; }
.msg { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--bg2); font-size: 13px; white-space: pre-wrap; }
.msg .who { font-size: 11px; color: var(--t3); margin-bottom: 3px; text-transform: lowercase; }
.msg.engineer { border-color: rgba(98,201,211,.25); background: rgba(98,201,211,.04); }
.pre { font: 400 12px/1.5 var(--mono); color: var(--t2); white-space: pre-wrap; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg2); max-height: 220px; overflow: auto; }
details.more summary { cursor: pointer; color: var(--t2); font-size: 13px; margin: 8px 0; }
.cite { font-size: 12.5px; color: var(--acc); margin-top: 6px; }

/* war room card */
.war { border: 1px solid rgba(233,162,59,.45); background: rgba(233,162,59,.04); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; animation: slide .35s var(--ease) both; }
.war .top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--t2); margin-bottom: 8px; }
.war h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.war .q { font: 500 13px var(--mono); }
.war .ctx { font-size: 13px; color: var(--t2); margin: 6px 0 10px; }
.war textarea, .war input { width: 100%; background: var(--bg); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; font-size: 13px; resize: vertical; }
.war textarea { min-height: 62px; }
.war .acts { display: flex; gap: 8px; margin-top: 10px; align-items: center; }

/* timeline tab */
.tl-row { display: grid; grid-template-columns: 64px 96px 34px 1fr; gap: 10px; padding: 6px 8px; border-radius: 6px; font-size: 13px; align-items: baseline; }
.tl-row .t { font: 400 12px var(--mono); color: var(--t3); text-align: right; }
.tl-row .a { font: 500 12px var(--mono); color: var(--t2); }
.tl-row .e { font: 400 12px var(--mono); color: var(--t3); }
.tl-row.takeover { background: rgba(233,162,59,.08); } .tl-row.takeover .e { color: var(--amb); }
.tl-row.action { background: rgba(63,207,142,.07); }
.tl-row.flash { outline: 1px solid var(--acc); }

/* idle */
.idle h2 { font-size: 22px; font-weight: 600; margin: 4px 0 6px; letter-spacing: -.015em; }
.idle p { color: var(--t2); margin: 0 0 22px; }
.loop { display: grid; gap: 14px; margin-bottom: 26px; }
.loop > div { display: grid; grid-template-columns: 26px 1fr; gap: 12px; }
.loop b { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line3); display: grid; place-items: center; font-size: 11px; color: var(--t2); }
.loop h5 { margin: 1px 0 3px; font-size: 14px; font-weight: 600; } .loop span { font-size: 13px; color: var(--t2); }
.next { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.next select { flex: 1; background: transparent; border: 0; font-size: 14px; }
.next select option { background: #141416; }

/* agents strip */
.agents { grid-column: 1 / 3; border-top: 1px solid var(--line); padding: 16px 24px 10px; display: grid; grid-template-columns: repeat(4, 1fr) 24px; gap: 14px; }
.agent { border: 1px solid #1f1f23; background: var(--card); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 50px 1fr; gap: 14px; align-items: center;
  transition: background .3s, border-color .3s; min-width: 0; }
.agent.amb { border-color: rgba(233,162,59,.45); background: rgba(233,162,59,.04); }
.agent.dead { background: #0d0d0e; border-color: var(--line); }
.agent.grn { border-color: rgba(63,207,142,.35); }

/* scrubber */

.scrub .tm { font: 400 12px var(--mono); color: var(--t2); width: 120px; }

.track .fill { position: absolute; left: 0; top: 8.5px; height: 1px; background: var(--t2); transition: width .6s linear; }
.track .dt { position: absolute; top: 4px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--t1); border: 1.5px solid var(--t1); cursor: pointer; padding: 0; }

.chipn { font: 500 12px var(--mono); border: 1px solid var(--line2); border-radius: 999px; padding: 3px 10px; white-space: nowrap; display: inline-block; }
.chipn.db { border-radius: 4px; }
.sig { font: 500 13px var(--mono); }
.desc { color: var(--t2); font-size: 13px; margin-top: 3px; }
.rules { color: var(--t2); font-size: 13px; display: grid; gap: 4px; padding: 0 0 6px; }
.fact { border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin-bottom: 14px; background: #0e0e10; }

table.load { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }

/* cypher drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 92vw); background: #0f0f11; border-left: 1px solid var(--line2); z-index: 70;
  transform: translateX(105%); transition: transform .35s var(--ease); display: flex; flex-direction: column; box-shadow: -30px 0 80px rgba(0,0,0,.5); }

pre .c { color: #5f6b6e; } pre .k { color: var(--acc); } pre .p { color: var(--amb); } pre .l { color: #b9a3f0; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes up { from { opacity: 0; transform: translate(var(--tx, 0), 10px); } to { opacity: 1; transform: translate(var(--tx, 0), 0); } }
@keyframes cap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 150ms !important; }
  .rp.draw { animation: none; stroke-dashoffset: 0; } .pulse, .travel { display: none; }
}
@media (max-width: 1500px) { #view-live { grid-template-columns: minmax(0, 1fr) 520px; } .caption span { font-size: 18px; } .hero { font-size: 130px; } }
</style>

    <div class="s" id="dr-why"></div></div>

<svg class="envelope" id="envelope" viewBox="0 0 22 16" hidden><rect x=".75" y=".75" width="20.5" height="14.5" rx="2" fill="#ededee"/><path d="M1.5 1.5 L11 9 L20.5 1.5" stroke="#0a0a0b" stroke-width="1.5" fill="none"/></svg>

<script>
"use strict";
/* Blast Radius UI. Everything shown is read from FalkorDB through the JSON API
   (web/app.py); nothing here is scripted. Animations play once, when the event
   they show first appears in the data. */
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = (x, d = 2) => (x === null || x === undefined || Number.isNaN(+x)) ? "—" : Number(x).toFixed(d);
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + "s")}`;
const secs = (ms) => `+${fmt((ms || 0) / 1000, 1)} s`;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const S = {
  settings: null, state: null, inc: null, map: null, memory: null, db: null,
  tab: "live", rail: "story", selected: null, follow: true, open: {},
  captions: true, seen: new Set(), dbDown: false, dbSince: 0, mapNode: null, armStep: 3,
};

async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)};
  let r;
  try { r = await fetch(path, opt); } catch (e) { setDbDown(true); throw e; }
  const data = await r.json().catch(() => ({}));
  if (data.db_down) { setDbDown(true); throw new Error(data.detail); }
  if (!r.ok) { toast(esc(data.detail || r.statusText)); throw new Error(data.detail || r.statusText); }
  setDbDown(false);
  return data;
}
function toast(html, ms = 4200) {
  const t = $("#toast");
  t.innerHTML = `<div class="toast">${html}</div>`;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.innerHTML = "", ms);
}
const label = (fam) => (S.settings?.labels || {})[fam] || fam || "—";
const once = (key) => { if (S.seen.has(key)) return false; S.seen.add(key); return S.booted && !REDUCED; };

/* ------------------------------------------------------------ plain English */
// The investigator's own measure rules (memory/playbook.py: Check.measure_of), so
// the checks can be shown passing one by one before the decision is written.
function measureOf(measure, obs, target) {
  if (measure.startsWith("last:")) { const s = (obs || {})[measure.slice(5)]; return s && s.length ? s[s.length - 1] : null; }
  if (measure === "deploys") return (obs || []).filter((c) => c.kind === "deploy").length;
  if (measure.startsWith("healthy:")) { const d = (obs || []).find((x) => x.dep === target); return d ? d.healthy : null; }
  return null;
}
const OPS = {"==": (a, b) => a === b, ">=": (a, b) => a >= b, "<=": (a, b) => a <= b,
  "<": (a, b) => a < b, ">": (a, b) => a > b, "!=": (a, b) => a !== b};
function humanCheck(tool, arg, measure, op, value, target) {
  const m = measure.replace("$target", target);
  if (measure === "deploys") return op === "==" && value === 0 ? `No deploy on ${arg} in the last 2 h` : `${arg} was deployed in the last 2 h`;
  if (measure.startsWith("healthy:")) return value === false ? `${arg} sees ${target} as unhealthy` : `${arg} sees ${target} as healthy`;
  if (m.endsWith("db_connections_pct")) return `${arg} uses ${op === ">=" ? "≥" : op} ${value}% of its connections`;
  if (m.endsWith("error_rate_pct")) return `${arg} error rate ${op === ">=" ? "≥" : op} ${value}%`;
  if (m.endsWith("cache_hit_rate_pct")) return `${arg} cache hit rate ${op === "<" ? "below" : op} ${value}%`;
  return `${tool}(${arg}): ${m} ${op} ${value}`;
}
function humanObserved(measure, o) {
  if (o === null || o === undefined) return "no reading";
  if (measure === "deploys") return plural(o, "deploy");
  if (measure.startsWith("healthy:")) return o === false ? "unhealthy" : o === true ? "healthy" : String(o);
  if (measure.endsWith("_pct")) return `${o}%`;
  return typeof o === "object" ? JSON.stringify(o) : String(o);
}
const parseVal = (v) => v === "False" ? false : v === "True" ? true : (v !== "" && !Number.isNaN(+v)) ? +v : v;
// "inspect_recent_changes(payments-gw): deploys == 0"
function parseDesc(desc) {
  const m = /^(\w+)\(([^)]*)\): (\S+) (==|>=|<=|!=|<|>) (.+)$/.exec(desc || "");
  return m ? {tool: m[1], arg: m[2], measure: m[3], op: m[4], value: parseVal(m[5])} : null;
}
const raw = (c) => `${c.tool}(${c.arg}): ${c.measure} ${c.op} ${c.value === false ? "False" : c.value === true ? "True" : c.value}`;
function humanTool(cp) {
  const a = cp.args || {}; const r = cp.result;
  switch (cp.tool) {
    case "find_upstream_candidates": return [`Listed what the alerting services depend on`, Array.isArray(r) ? plural(r.length, "candidate") : ""];
    case "inspect_recent_changes": { const n = (r || []).filter((c) => c.kind === "deploy").length; return [`Recent changes on ${a.service}`, plural(n, "deploy")]; }
    case "check_dependency_health": { const bad = (r || []).filter((d) => d.healthy === false).map((d) => d.dep);
      return [`Health of what ${a.service} depends on`, bad.length ? `unhealthy: ${bad.join(", ")}` : "all healthy"]; }
    case "inspect_metrics": { const vals = Object.entries(r || {}).filter(([k, v]) => Array.isArray(v) && k !== "times_ms")
        .map(([k, v]) => `${k.replace("_pct", "")} ${v[v.length - 1]}${k.endsWith("_pct") ? "%" : ""}`);
      return [`Metrics for ${a.node}`, vals.join(", ")]; }
    case "inspect_logs": return [`Logs from ${a.node}`, Array.isArray(r) ? plural(r.length, "line") : ""];
    case "blast_radius": return [`Blast radius of ${a.node}`, Array.isArray(r) ? plural(r.length, "service") : ""];
    case "who_to_page": return [`Who is on call for ${a.node}`, r?.person || r?.handle || ""];
    default: return [cp.tool, ""];
  }
}
const shortTool = (cp) => humanTool(cp)[0];

/* ------------------------------------------------------------ the story */
// Turns one incident (head, lens, tasks, checkpoints, actions, messages) into
// what the page shows: the stepper, the caption, node states and recall paths.
function candidatesOf(x) {
  const pbs = Object.fromEntries((S.memory?.playbooks || []).map((p) => [p.id, p]));
  if (x.lens.length) {
    return x.lens.map((l) => {
      const rows = l.checks.map((c) => { const p = parseDesc(c.description) || {tool: "", arg: "", measure: "", op: "", value: ""};
        return {...p, text: p.tool ? humanCheck(p.tool, p.arg, p.measure, p.op, p.value, l.target) : c.description,
          raw: c.description, observed: c.observed, obsText: humanObserved(p.measure, c.observed),
          state: c.passed ? "pass" : "fail", step: c.step_n, phase: c.phase}; });
      const pb = pbs[l.memory];
      const total = pb ? pb.preconditions.length + pb.steps.length : rows.length;
      return {key: l.memory + ">" + l.target, memory: l.memory, signature: l.signature, target: l.target, path: l.path || [],
        hops: l.hops, score: l.score, viaKind: !(l.pinned_to || []).includes(l.target), pinned: l.pinned_to || [],
        trust: l.trust_at_use, trustAfter: l.trust_after, verdict: l.verdict, learned: l.learned_from || [], status: l.status,
        rows, total, outcome: l.applied ? "holds" : "ruled", final: true};
    });
  }
  let active = false;
  return (x.recalling || []).map((r) => {
    const pb = pbs[r.memory_id];
    const path = r.path || [];
    const b = {alerting: path[0], caller: path.length >= 2 ? path[path.length - 2] : null, target: r.target};
    const bind = (v) => typeof v === "string" && v.startsWith("$") ? b[v.slice(1)] : v;
    const checks = pb ? [...pb.preconditions.map((c) => ({...c, phase: "precondition"})), ...pb.steps.map((c) => ({...c, phase: "step"}))] : [];
    const rows = []; let failed = false, waiting = false;
    for (const c of checks) {
      const args = Object.fromEntries(Object.entries(c.args).map(([k, v]) => [k, bind(v)]));
      const arg = Object.values(args)[0];
      const text = humanCheck(c.tool, arg, c.measure, c.op, c.value, r.target);
      const rr = raw({tool: c.tool, arg, measure: c.measure.replace("$target", r.target), op: c.op, value: c.value});
      if (failed || waiting) { rows.push({text, raw: rr, state: "wait", phase: c.phase, measure: c.measure}); continue; }
      const cp = x.checkpoints.find((k) => k.task.endsWith(":investigate") && k.tool === c.tool &&
        JSON.stringify(k.args) === JSON.stringify(args));
      if (!cp) { waiting = true; rows.push({text, raw: rr, state: "pend", phase: c.phase, measure: c.measure}); continue; }
      const o = measureOf(c.measure, cp.result, r.target);
      const ok = o !== null && OPS[c.op](o, c.value);
      rows.push({text, raw: rr, observed: o, obsText: humanObserved(c.measure, o), state: ok ? "pass" : "fail", step: cp.n, phase: c.phase, measure: c.measure});
      if (!ok) failed = true;
    }
    let outcome = failed ? "ruled" : waiting ? "checking" : "holds";
    if (outcome === "checking") {
      if (active) { outcome = "queued"; rows.forEach((q) => { if (q.state === "pend") q.state = "wait"; }); }
      active = true;
    }
    return {key: r.memory_id + ">" + r.target, memory: r.memory_id, signature: pb?.signature || r.memory_id, target: r.target, path,
      hops: r.hops, score: r.score, viaKind: !!r.via_kind, pinned: pb?.about || [], trust: r.trust, learned: pb?.learned_from || [],
      status: pb?.status, rows, total: checks.length, outcome, final: false};
  });
}

function storyOf(x) {
  const T = (k) => x.tasks.find((t) => t.type === k);
  const inv = T("investigate"), resp = T("respond"), learn = T("learn");
  const h = x.head, tl = x.timeline;
  const tOf = (pred) => { const e = tl.find(pred); return e ? secs(e.t_ms) : ""; };
  const lastOf = (pred) => { const e = [...tl].reverse().find(pred); return e ? secs(e.t_ms) : ""; };
  const alive = Object.fromEntries((S.state?.workers || []).map((w) => [w.name, w.alive]));
  const cands = candidatesOf(x);
  const invCps = x.checkpoints.filter((c) => c.task.endsWith(":investigate"));
  const claims = inv?.claimed_by || [];
  const takeover = claims.length > 1 ? {from: claims[claims.length - 2], to: claims[claims.length - 1], epoch: claims.length,
    step: (invCps.find((c) => c.epoch === claims.length) || {}).n || (invCps.length + 1)} : null;
  const held = x.tasks.find((t) => t.status === "leased");
  const deadHolder = held && alive[held.owner] === false ? held : null;
  const stuck = x.tasks.find((t) => t.status === "stuck");
  const pending = (S.state?.pending || []).find((p) => p.incident_key === h.key);
  const action = x.actions[0];
  const owner = (S.map?.org || []).find((t) => h.root && t.owns.includes(h.root));
  const newPb = (S.memory?.playbooks || []).find((p) => (p.learned_from || []).includes(h.id));
  const helped = cands.find((c) => c.verdict === "helped"), misled = cands.find((c) => c.verdict === "misled");
  const applied = cands.find((c) => c.outcome === "holds");
  const checking = cands.find((c) => c.outcome === "checking") || (!h.decision_id && cands.find((c) => c.outcome === "queued"));
  const allRuled = cands.length && cands.every((c) => c.outcome === "ruled");

  let phase = "queued";
  if (stuck) phase = "stuck";
  else if (h.status === "needs_review") phase = "rejected";
  else if (learn?.status === "done") phase = "learned";
  else if (h.verdict) phase = "confirmed";
  else if (action) phase = pending ? "review" : "paged";
  else if (h.decision_id) phase = "diagnosed";
  else if (claims.length) phase = cands.length ? (allRuled ? "investigating" : "checking") : "investigating";

  const steps = [];
  const st = (state, title, o = {}) => steps.push({state, title, ...o});
  // 1 alerts
  st("done", `Alerts on ${plural(h.alerting.length, "service")}`, {time: secs(0), id: "alerts",
    kv: h.alert_texts.map((t) => { const i = t.indexOf(": "); return [t.slice(0, i), t.slice(i + 2)]; })});
  // 2 recall
  if (!claims.length) st("current", "Recalling playbooks from memory", {id: "recall"});
  else if (cands.length) st("done", `Recalled ${plural(cands.length, "playbook match", "playbook matches")} from memory`, {time: tOf((e) => e.kind === "claim" && e.task === "investigate"), id: "recall",
    kv: cands.map((c) => [`${c.signature}`, `${c.target} · ${plural(c.hops, "hop")} · ${c.viaKind ? "same kind of datastore" : "pinned here"} · trust ${fmt(c.trust)}`])});
  else st("done", "Nothing in memory near these alerts", {time: tOf((e) => e.kind === "claim" && e.task === "investigate"), id: "recall",
    kv: [["what happens", "first time here: investigate step by step; if confirmed, it becomes a playbook"]]});
  // 3 check / investigate
  const toNote = takeover ? {noteTag: `e${takeover.epoch - 1} → e${takeover.epoch}`, note: `${takeover.to} took over at step ${takeover.step}, not from scratch`} : {};
  if (!claims.length) st("pending", "Check against live evidence");
  else if (cands.length) {
    let title, state = "done";
    if (h.decision_id || phase === "investigating") {
      if (applied) title = `Checked ${applied.target}: ${applied.rows.filter((r) => r.state === "pass").length} of ${applied.total} hold`;
      else { title = allRuled ? `Ruled out ${cands.length === 1 ? "the recalled playbook" : "all " + cands.length + " matches"}: the evidence didn't fit` : "Checked against live evidence"; state = "ruled"; }
      if (!applied && phase === "investigating") { title = title + ", investigating"; state = "current"; }
    } else if (checking) { title = `Checking ${checking.signature} on ${checking.target} against live evidence`; state = "current"; }
    else { title = "Checking against live evidence"; state = "current"; }
    st(state, title, {time: lastOf((e) => e.kind === "checkpoint"), id: "check", lens: cands, ...toNote,
      extra: (() => { const used = new Set(cands.flatMap((c) => c.rows.map((r) => r.step).filter(Boolean)));
        const rest = invCps.filter((c) => !used.has(c.n)); return !applied && rest.length ? rest : null; })()});
  } else {
    st(h.decision_id ? "done" : "current", h.decision_id ? `Investigated in ${plural(invCps.length, "step")}` : `Investigating step by step${invCps.length ? ` · step ${invCps.length}` : ""}`,
      {time: lastOf((e) => e.kind === "checkpoint"), id: "check", cps: invCps, ...toNote});
  }
  // 4 diagnosis
  if (h.decision_id) st("done", `Diagnosis: ${h.root}, ${label(h.family)}`, {time: tOf((e) => e.kind === "done" && e.task === "investigate"), id: "diag",
    kv: [["decided by", `${h.decided_by} · epoch e${h.decided_epoch}`],
      ["how", applied ? "from memory, after every check held (no model call)" : (S.settings.model === "rule-based" ? "step by step (rule-based planner)" : `step by step with ${S.settings.model}`)],
      ...(x.impact.length ? [["customers affected via", x.impact.map((r) => `${r.service} (${plural(r.hops, "hop")})`).join(", ")]] : []),
      ...(h.summary && !applied ? [["finding", h.summary]] : [])]});
  else st("pending", "Diagnosis");
  // 5 page
  if (action) {
    const n = x.actions.length;
    st("done", `${n === 1 ? "1" : n} ${action.channel}${n === 1 ? "" : "s"} sent to ${action.recipient}`, {time: tOf((e) => e.kind === "action"), id: "page",
      kv: [["why " + action.recipient, owner ? `on call for ${owner.team}, which owns ${h.root}` : `on call for the owner of ${h.root}`],
        ["how", (action.payload?.applied_preferences || []).length ? `${action.channel}, ${action.payload.applied_preferences[0]}` : `${action.channel} (team default)`],
        ["sent once", `intent ${action.key}`]], action});
  } else st(resp?.status === "leased" ? "current" : "pending", resp?.status === "leased" ? "Notifying the on-call engineer" : "Page on-call");
  // 6 human
  if (h.verdict) st(h.verdict === "confirmed" ? "ok" : "bad", `${h.verdict === "confirmed" ? "Confirmed" : "Rejected"} by ${h.verdict_by}`, {id: "human", time: "", chat: true});
  else st(pending ? "current" : "pending", pending ? `Waiting for ${action?.recipient || "the engineer"} to confirm` : "Engineer confirms", {id: "human", chat: !!action});
  // 7 learn
  if (learn?.status === "done") {
    const parts = [], kv = [];
    if (helped) { parts.push(`trust ${fmt(helped.trust)} → ${fmt(helped.trustAfter)}`); kv.push([helped.signature, `helped · trust ${fmt(helped.trust)} → ${fmt(helped.trustAfter)}`]); }
    if (misled) { parts.push(`trust lowered ${fmt(misled.trust)} → ${fmt(misled.trustAfter)}`); kv.push([misled.signature, `misled · trust ${fmt(misled.trust)} → ${fmt(misled.trustAfter)}${misled.status === "retired" ? " · retired" : ""}`]); }
    cands.filter((c) => c.verdict === "not_applicable").forEach((c) => kv.push([`${c.signature} on ${c.target}`, `not applicable · trust unchanged`]));
    if (newPb) { parts.push(`new playbook pinned to ${newPb.about.join(", ")}`); kv.push(["new playbook", `${newPb.signature} on ${newPb.about.join(", ")} · trust ${fmt(newPb.trust)}`]); }
    st(helped ? "ok" : misled ? "bad" : "done", parts.length ? `Learned: ${parts.join("; ")}` : "Learned: verdicts recorded", {time: tOf((e) => e.kind === "done" && e.task === "learn"), id: "learn", kv});
  } else st(learn?.status === "leased" ? "current" : "pending", "Learn");
  if (stuck) steps.splice(3, 0, {state: "bad", title: `Stuck: ${stuck.type} failed ${stuck.attempts} times, a human needs to look`, id: "stuck"});

  // caption: one plain sentence for what is happening now
  const who = action?.recipient || owner?.on_call?.[0] || "the on-call engineer";
  let cap;
  const recentTake = takeover && phase === "checking" || (takeover && phase === "investigating");
  if (deadHolder) cap = `${deadHolder.owner} was killed mid-task. Its lease runs out in ${fmt(Math.max(0, deadHolder.lease_left_ms) / 1000, 1)} s; until then nobody else can claim the task.`;
  else if (phase === "queued") cap = `${plural(h.alerting.length, "service")} start breaching their SLO. Triage opens an incident and queues a task in the graph.`;
  else if (recentTake && !h.decision_id) cap = `${takeover.to} took over from the last checkpoint, at step ${takeover.step}, under a new fencing epoch. Not from scratch.`;
  else if (phase === "checking") cap = invCps.length ? "Before trusting a recalled playbook, the agent checks it against live evidence." : "Agents recall playbooks by walking the dependency graph from the alerting services.";
  else if (phase === "investigating") cap = allRuled ? "The recalled playbook doesn't match the evidence, so it is ruled out, trust unchanged. The agent digs in." : "Nothing in memory near these alerts, so the investigator works it out step by step, checkpointing each step to the graph.";
  else if (phase === "diagnosed") cap = `Diagnosis: ${h.root}. The responder takes over through the graph and looks up who is on call.`;
  else if (phase === "review") cap = `Exactly one ${action.channel} went to ${who}. The agents now ask ${who} to confirm.`;
  else if (phase === "paged") cap = `Exactly one ${action.channel} goes to ${who}${(action.payload?.applied_preferences || []).length ? ", the way they asked in an earlier incident" : ""}.`;
  else if (phase === "confirmed") cap = `${h.verdict_by} confirmed. The learner records what each memory did.`;
  else if (phase === "learned") cap = helped ? `The playbook helped, so its trust went up: ${fmt(helped.trust)} → ${fmt(helped.trustAfter)}.`
    : misled ? `The playbook misled the agent, so its trust went down${misled.status === "retired" ? " and it retired" : ""}.`
    : newPb ? `The confirmed fix becomes a playbook pinned to ${newPb.about.join(", ")}. Next time it is recalled.` : "Verdicts recorded.";
  else if (phase === "rejected") cap = `${h.verdict_by} rejected the diagnosis. Any memory that led to it loses trust.`;
  else if (phase === "stuck") cap = "A task failed three times. The stuck sweep took it out of rotation so a human can look.";

  return {steps, phase, cap, cands, applied, checking, allRuled, takeover, deadHolder, action, pending, helped, misled, newPb, invCps, held};
}

/* ------------------------------------------------------------ graph */
const GW = 1200, ROWY = [70, 220, 370, 545], NH = 34;
const nodeW = (name) => Math.max(96, Math.round(name.length * 8.1 + 30));
function layout(nodes) {
  const callers = {}; nodes.forEach((n) => n.depends_on.forEach((d) => (callers[d] ||= []).push(n.name)));
  const depth = {};
  const deep = (n) => depth[n] ??= Math.max(0, ...(callers[n] || []).map((c) => deep(c) + 1));
  nodes.forEach((n) => deep(n.name));
  const svc = nodes.filter((n) => !n.kind), ds = nodes.filter((n) => n.kind);
  const maxSvc = Math.max(...svc.map((n) => depth[n.name]));
  const layers = []; svc.forEach((n) => (layers[depth[n.name]] ||= []).push(n.name));
  layers[maxSvc + 1] = ds.map((n) => n.name);
  const pos = {};
  const place = () => layers.forEach((l, y) => l.forEach((n, i) => pos[n] = {i, y, n: l.length}));
  place();
  for (let pass = 0; pass < 4; pass++) layers.forEach((l, y) => {
    if (y === 0) return;
    const bc = (n) => { const ps = (callers[n] || []).map((c) => (pos[c].i + .5) / pos[c].n); return ps.length ? ps.reduce((a, b) => a + b) / ps.length : .5; };
    l.sort((a, b) => bc(a) - bc(b)); place();
  });
  const xy = {};
  layers.forEach((l, y) => l.forEach((n, i) => {
    xy[n] = {x: 60 + (GW - 120) * (i + .5) / l.length, y: ROWY[Math.min(y, ROWY.length - 1)] + (y >= ROWY.length ? 0 : 0), db: !!nodes.find((q) => q.name === n).kind};
  }));
  return xy;
}
const edgeD = (a, b) => `M${a.x},${a.y + NH / 2} C${a.x},${(a.y + b.y) / 2 + 10} ${b.x},${(a.y + b.y) / 2 - 10} ${b.x},${b.y - NH / 2}`;

const NS = {
  base: ["#131315", "#2c2c31", "#d8d8dc"], alert: ["rgba(239,91,91,.08)", "rgba(239,91,91,.65)", "#ededee", "rgba(239,91,91,.14)"],
  target: ["rgba(98,201,211,.07)", "#62c9d3", "#ededee", "rgba(98,201,211,.12)"], target2: ["#131315", "rgba(98,201,211,.45)", "#ededee"],
  suspect: ["rgba(233,162,59,.08)", "rgba(233,162,59,.75)", "#ededee", "rgba(233,162,59,.13)"],
  root: ["rgba(63,207,142,.08)", "rgba(63,207,142,.75)", "#ededee", "rgba(63,207,142,.13)"],
  ruled: ["#131315", "#3a3a40", "#a1a1a9"], path: ["#131315", "#3a3a40", "#ededee"], probe: ["#131315", "rgba(233,162,59,.55)", "#ededee"],
};

function graphModel(x, s) {
  // node states, captions, paths, check card for the selected incident
  const nodes = {}, paths = [];
  const set = (n, st, cap) => { nodes[n] = {st, cap: cap ?? nodes[n]?.cap}; };
  if (!x) return {nodes, paths, dim: false};
  const h = x.head;
  const over = ["learned", "confirmed"].includes(s.phase);
  h.alerting.forEach((a) => set(a, over ? "path" : "alert"));
  s.cands.forEach((c) => {
    const kind = c.outcome === "ruled" ? "ruled" : (c === s.checking || c === s.applied) ? "main" : "faint";
    paths.push({hops: c.path, kind, key: `${h.key}|${c.key}`, label: kind === "main" || (kind === "ruled" && s.allRuled && c === s.cands[0])
      ? `${plural(c.hops, "hop")} · ${c.viaKind ? "same kind of datastore" : "pinned here"}` : null});
    c.path.slice(1, -1).forEach((n) => { if (!nodes[n]) set(n, "path"); });
    set(c.target, c.outcome === "ruled" ? "ruled" : kind === "main" ? "target" : "target2");
  });
  if (!s.cands.length && !h.decision_id && s.invCps.length) {
    const last = s.invCps[s.invCps.length - 1]; const n = last.args?.node || last.args?.service;
    if (n && !h.alerting.includes(n)) set(n, "probe", `step ${last.n}: ${shortTool(last).split(" ")[0].toLowerCase()} ${""}`.trim());
  }
  if (h.root) set(h.root, h.verdict === "confirmed" ? "root" : "suspect",
    h.verdict === "confirmed" ? `root cause · ${label(h.family)}` : `diagnosis · ${label(h.family)}`);
  if (s.applied && !h.root) nodes[s.applied.target].cap = `checks ${s.applied.rows.filter((r) => r.state === "pass").length} / ${s.applied.total} hold`;
  // check card: the memory being checked now, or the last one ruled out
  let card = null;
  const c = s.checking || (!h.verdict && s.applied) || (s.allRuled && !h.verdict ? s.cands[0] : null);
  if (c && s.phase !== "learned") card = c;
  return {nodes, paths, card, dim: true};
}

function renderGraph() {
  if (!S.map) return;
  const xy = layout(S.map.nodes);
  S.xy = xy;
  const x = S.tab === "live" ? S.inc : null;
  const s = x ? S.story : null;
  const g = graphModel(x, s || {cands: [], invCps: []});
  // pins: active playbooks on the nodes they are pinned to, trust shown live
  const pins = {};
  (S.memory?.playbooks || []).forEach((p) => p.about.forEach((a) => (pins[a] ||= []).push(p)));
  const lensFor = (pid) => s?.cands.find((c) => c.memory === pid && c.final);
  const sig = JSON.stringify([x?.head.key, g, Object.entries(pins).map(([k, v]) => [k, v.map((p) => [p.id, fmt(p.trust), p.status])]), S.mapNode, s?.phase]);
  if ($("#graph").dataset.sig === sig) return;
  $("#graph").dataset.sig = sig;

  let edges = "", over = "", boxes = "", fx = "";
  S.map.nodes.forEach((n) => n.depends_on.forEach((d) => { edges += `<path class="edge" d="${edgeD(xy[n.name], xy[d])}"/>`; }));
  g.paths.forEach((p) => {
    const segs = []; for (let i = 1; i < p.hops.length; i++) if (xy[p.hops[i - 1]] && xy[p.hops[i]]) segs.push(edgeD(xy[p.hops[i - 1]], xy[p.hops[i]]));
    const fresh = once("path:" + p.key + ":" + p.kind);
    segs.forEach((d, i) => { over += `<path pathLength="1" class="rp ${p.kind} ${fresh ? "draw" : ""}" style="--d:.4s;animation-delay:${i * .4}s" d="${d}"/>`; });
    if (fresh && p.kind === "main" && segs.length) over += `<circle class="travel" r="4"><animateMotion dur="${.4 * segs.length + .2}s" fill="freeze" path="${segs.join(" ").replace(/ M/g, " L")}"/></circle>`;
    if (p.label && p.hops.length >= 2) {
      const a = xy[p.hops[p.hops.length - 2]], b = xy[p.hops[p.hops.length - 1]];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + 12;
      over += `<text class="plabel ${p.kind === "ruled" ? "ruled" : ""}" x="${mx + (b.x >= a.x ? 14 : -14)}" y="${my}" text-anchor="${b.x >= a.x ? "start" : "end"}" style="${fresh ? "animation:fade .3s .6s both" : ""}">${esc(p.label)}</text>`;
    }
  });
  let ai = 0;
  S.map.nodes.forEach((n) => {
    const p = xy[n.name]; const st = g.nodes[n.name]; const [fill, stroke, col, ring] = NS[st?.st || "base"];
    const w = nodeW(n.name), rx = p.db ? 5 : NH / 2;
    const faded = g.dim && !st ? "faded" : "";
    const pulse = st?.st === "alert" && once("pulse:" + x.head.key + ":" + n.name);
    boxes += `<g class="node ${faded}" data-node="${esc(n.name)}">
      ${ring ? `<rect x="${p.x - w / 2 - 4}" y="${p.y - NH / 2 - 4}" width="${w + 8}" height="${NH + 8}" rx="${rx + 4}" fill="none" stroke="${ring}" stroke-width="4"/>` : ""}
      ${pulse ? `<rect class="pulse" style="--delay:${.2 + (ai++) * .08}s" x="${p.x - w / 2}" y="${p.y - NH / 2}" width="${w}" height="${NH}" rx="${rx}"/>` : ""}
      <rect class="box" x="${p.x - w / 2}" y="${p.y - NH / 2}" width="${w}" height="${NH}" rx="${rx}" fill="${fill}" stroke="${S.mapNode === n.name ? "#ededee" : stroke}" stroke-width="1"/>
      <text x="${p.x}" y="${p.y + 4.5}" text-anchor="middle" style="fill:${col}">${esc(n.name)}</text>
      ${st?.cap ? `<text class="cap" x="${p.x}" y="${p.y + NH / 2 + 18}" text-anchor="middle" style="fill:${st.st === "root" ? "var(--grn)" : st.st === "suspect" || st.st === "probe" ? "var(--amb)" : "var(--t2)"}">${esc(st.cap)}</text>` : ""}
    </g>`;
    (pins[n.name] || []).forEach((pb, i) => {
      const l = lensFor(pb.id);
      let txt = fmt(pb.trust), cls = "";
      if (pb.status === "retired") cls = "ret";
      else if (l && l.verdict === "helped" && s.phase === "learned") { txt = `${fmt(l.trust)} → ${fmt(l.trustAfter)}`; cls = "grn"; }
      else if (s && s.cands.length && s.cands.every((c) => c.memory !== pb.id || c.outcome === "ruled") && s.cands.some((c) => c.memory === pb.id)) cls = "neu";
      const tw = txt.length * 6.8 + 22, px = p.x + w / 2 - tw + 10 - i * (tw + 4), py = p.y - NH / 2 - 11;
      const fresh = once("pin:" + pb.id + ":" + txt);
      boxes += `<g transform="translate(${px},${py})"><g class="pin ${cls} ${fresh ? "pop-in" : ""}"><title>${esc(pb.signature)} · learned from ${esc(pb.learned_from.join(", "))}</title>
        <rect width="${tw}" height="18" rx="9"/><circle cx="9" cy="9" r="2.5"/><text x="16" y="12.5">${esc(txt)}</text></g></g>`;
    });
  });
  if (g.card && xy[g.card.target]) {
    const c = g.card, p = xy[c.target];
    const rows = (c.outcome === "ruled" ? c.rows.filter((r) => r.state !== "wait" && r.state !== "pend") : c.rows).map((r) => {
      const fresh = once("row:" + x.head.key + ":" + c.key + ":" + r.text + ":" + r.state);
      const gl = r.state === "pass" ? "✓" : r.state === "fail" ? "✕" : "";
      const o = r.state === "pass" || r.state === "fail" ? `observed ${esc(r.obsText)}` : r.state === "pend" ? `<span style="color:var(--amb)">reading…</span>` : "waiting";
      return `<div class="crow ${fresh ? "new" : ""}"><span class="glyph g-${r.state}">${gl}</span><div>${esc(r.text)}<div class="o">${o}</div></div></div>`;
    }).join("");
    const done = c.rows.filter((r) => r.state === "pass").length;
    const msg = c.outcome === "ruled" ? `<div class="cmsg">Not applicable · trust unchanged</div>` : "";
    const cw = 330;
    const lines = (t) => Math.max(1, Math.ceil(t.length * 7.4 / (cw - 62)));
    const ch = 56 + (c.outcome === "ruled" ? c.rows.filter((r) => r.state !== "wait" && r.state !== "pend") : c.rows).reduce((n, r) => n + 19 * lines(r.text) + 36, 0) + (msg ? 36 : 0);
    // put the card next to its node, where it covers the fewest nodes in play
    const boxOf = (name, pad = 8) => { const q = xy[name], w = nodeW(name); return [q.x - w / 2 - pad, q.y - NH / 2 - pad, q.x + w / 2 + pad, q.y + NH / 2 + 26]; };
    const busy = Object.keys(g.nodes).filter((n) => xy[n]).map((n) => [boxOf(n), n === c.target ? 6 : 1]);
    const ov = (a, b) => Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])) * Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
    let best = null;
    for (const sx of [p.x + nodeW(c.target) / 2 + 24, p.x - nodeW(c.target) / 2 - 24 - cw]) {
      for (const sy of [p.y - ch + 30, p.y - ch / 2, p.y - 30, 40, 600 - ch]) {
        const x0 = Math.max(8, Math.min(GW - cw - 8, sx)), y0 = Math.max(36, Math.min(600 - ch, sy));
        const r = [x0, y0, x0 + cw, y0 + ch];
        const cost = busy.reduce((n, [b, w]) => n + ov(r, b) * w * 4, 0) + Math.hypot(x0 + cw / 2 - p.x, y0 + ch / 2 - p.y) * 3;
        if (!best || cost < best.cost) best = {cost, x0, y0};
      }
    }

  st.workers.forEach((w) => {
    const holds = tasks.find((t) => t.owner === w.name && t.status === "leased");
    const mine = cpsBy(w.name); const last = mine[mine.length - 1];
    const took = s?.takeover?.to === w.name && !x.head.decision_id;
    if (!w.alive) {
      item(w.name, "investigator", {tone: "dead", badge: w.killed ? "SIGKILL" : "stopped", badgeMono: true,
        step: last ? `Last checkpoint · step ${last.n}` : "Not running", epoch: last ? `e${last.epoch}` : "—",
        note: holds ? "lease draining · no heartbeats" : (last ? "lease expired" : ""), left: holds ? holds.lease_left_ms : 0, max: lease, start: true});
    } else if (holds) {
      item(w.name, "investigator", {tone: "amb", badge: took ? "took over" : "running",
        step: last ? `Step ${last.n} · ${shortTool(last)}` : "Claimed the task", epoch: took ? `e${holds.epoch - 1} → e${holds.epoch}` : `e${holds.epoch}`, hot: took,
        note: `renews every ${S.settings.heartbeat_ms / 1000} s`, left: holds.lease_left_ms, max: lease, kill: true});
    } else {
      const done = tasks.find((t) => t.owner === w.name && t.status === "done");
      item(w.name, "investigator", {tone: "", badge: done ? "done" : "idle", step: done && x?.head.root ? `Diagnosed ${x.head.root}` : `Watching ${S.settings.graph}`,
        epoch: done ? `e${done.epoch}` : "—", note: done ? "lease released" : "no lease", left: 0, max: lease, kill: true});
    }
  });
  const thread = (name, role, type, busy, done, idle) => {
    const t = tasks.find((q) => q.type === type);
    if (t?.status === "leased") item(name, role, {tone: "amb", badge: "running", step: busy, epoch: `e${t.epoch}`, note: `renews every ${S.settings.heartbeat_ms / 1000} s`, left: t.lease_left_ms, max: lease});
    else if (t?.status === "done") item(name, role, {tone: s?.helped && type === "learn" ? "grn" : "", badge: "done", step: done, epoch: `e${t.epoch}`, note: "lease released", left: 0, max: lease});
    else item(name, role, {tone: "", badge: "idle", step: idle, epoch: "—", note: "no lease", left: 0, max: lease});
  };
  const resp = Object.keys(st.threads || {}).find((n) => n.startsWith("resp")) || "responder-1";
  const lrn = Object.keys(st.threads || {}).find((n) => n.startsWith("learn")) || "learner-1";
  const a = s?.action;
  thread(resp, "responder", "respond", s?.pending ? `Waiting for ${a?.recipient || "the engineer"} to confirm` : "Notifying the on-call engineer",
    a ? `Sent ${plural(x.actions.length, a.channel)} to ${a.recipient} · 0 duplicates` : "Done", "Waits for a diagnosis");
  thread(lrn, "learner", "learn", "Writing verdicts and trust",
    s?.helped ? `${s.helped.signature} trust ${fmt(s.helped.trust)} → ${fmt(s.helped.trustAfter)}` : s?.newPb ? `New playbook on ${s.newPb.about.join(", ")}` : "Verdicts recorded", "Waits for an outcome");
  const html = cards.map((c) => {
    const frac = c.left > 0 ? Math.min(1, c.left / c.max) : 0;
    const rc = c.tone === "dead" ? "#6e6e76" : c.tone === "amb" ? "#e9a23b" : c.tone === "grn" ? "#3fcf8e" : "#3a3a40";
    const badgeCls = c.tone === "amb" ? "amb" : c.tone === "grn" ? "grn" : "";
    const btn = c.kill ? `<button class="btn small danger kill" data-kill="${esc(c.name)}" title="Send a real SIGKILL to this process">Kill</button>`
      : c.start ? `<button class="btn small kill" data-start="${esc(c.name)}">Start</button>` : "";
    return `<div class="agent ${c.tone}" data-agent="${esc(c.name)}">
      <div class="lring"><svg width="50" height="50"><circle class="tr" cx="25" cy="25" r="21"/><circle class="fg" cx="25" cy="25" r="21" stroke="${rc}"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}"/></svg><span>${c.left > 0 ? (c.tone === "dead" ? fmt(c.left / 1000, 1) : Math.ceil(c.left / 1000)) + "s" : "–"}</span></div>
      <div style="min-width:0"><div class="nm"><b>${esc(c.name)}</b><span class="r">${esc(c.role)}</span><span class="badge ${badgeCls} ${c.badgeMono ? "mono" : ""}">${esc(c.badge)}</span>${btn}</div>
        <div class="st" title="${esc(c.step)}">${esc(c.step)}</div>
        <div class="ep">epoch <b class="${c.hot ? "hot" : ""}">${esc(c.epoch)}</b>${c.note ? ` · ${esc(c.note)}` : ""}</div></div></div>`;
  }).join("") + `<div style="display:flex;align-items:flex-start"><button class="qbtn" data-q="agents" title="Claims, heartbeats, fenced checkpoints">‹›</button></div>`;
  const shape = html.replace(/stroke-dashoffset="[\d.]+"/g, "").replace(/<span>[\d.]+s<\/span>/g, "");
  const box = $("#agents");
  if (box.dataset.shape === shape) {   // only the lease rings move: keep the buttons under the cursor
    cards.forEach((c, i) => { const el = box.children[i]; if (!el) return;
      const frac = c.left > 0 ? Math.min(1, c.left / c.max) : 0;
      el.querySelector(".fg").setAttribute("stroke-dashoffset", (C * (1 - frac)).toFixed(1));
      el.querySelector(".lring span").textContent = c.left > 0 ? (c.tone === "dead" ? fmt(c.left / 1000, 1) : Math.ceil(c.left / 1000)) + "s" : "–"; });
    return;
  }
  box.dataset.shape = shape; box.innerHTML = html;
  box.querySelectorAll("[data-kill]").forEach((b) => b.onclick = async () => { await api(`/api/workers/${b.dataset.kill}/kill`, {}); pollState(); });
  box.querySelectorAll("[data-start]").forEach((b) => b.onclick = async () => { await api(`/api/workers/${b.dataset.start}/start`, {}); pollState(); });
  bindQ(box);
}

/* ------------------------------------------------------------ timeline scrubber */
function renderScrub() {
  const x = S.inc;
  if (!x) { $("#scrub").innerHTML = `<span class="tm">—</span><div class="track"></div><span class="lbl">Every step is stored in the graph</span>`; return; }
  const tl = x.timeline; const end = Math.max(1, ...tl.map((e) => e.t_ms || 0));
  const live = x.tasks.some((t) => t.status === "leased" || t.status === "open") || !!S.story.pending;
  const now = live ? Math.max(end, Date.now() - (x.tasks[0]?.created_at || Date.now()) ) : end;
  const span = Math.max(now, 1000);
  const dots = tl.map((e, i) => {
    const major = ["takeover", "action"].includes(e.kind) || (e.kind === "done" && e.task === "investigate") || (e.kind === "claim" && e.task === "investigate") || e.kind === "checkpoint";
    const cls = e.kind === "takeover" ? "takeover" : e.kind === "action" ? "action" : major ? "" : "minor";
    return `<button class="dt ${cls}" style="left:${(e.t_ms || 0) / span * 100}%" title="${esc(secs(e.t_ms) + " · " + tlText(e, x))}" data-dot="${i}"></button>`;
  }).join("");
  const lk = S.state?.last_kill;
  const html = `<span class="tm">${secs(now)}</span><div class="track"><div class="fill" style="width:${end / span * 100}%"></div>${dots}</div>
    <span class="lbl">${live ? "Live" : "Replay"} · every step is stored in the graph${lk && x.head.key === lk.task.replace(":investigate", "") ? ` · SIGKILL ${esc(lk.worker)} after step ${lk.after_step}` : ""}</span>
    <button class="qbtn" data-q="timeline" title="The Cypher behind the timeline">‹›</button>`;
  if ($("#scrub").dataset.sig === html) return;
  $("#scrub").dataset.sig = html; $("#scrub").innerHTML = html;
  $("#scrub").querySelectorAll("[data-dot]").forEach((b) => b.onclick = () => {
    S.rail = "timeline"; renderRailHead(); renderRail();
    const row = document.querySelector(`[data-tl="${b.dataset.dot}"]`);
    if (row) { row.scrollIntoView({block: "center", behavior: "smooth"}); row.classList.add("flash"); setTimeout(() => row.classList.remove("flash"), 1600); }
  });
  bindQ($("#scrub"));
}

/* ------------------------------------------------------------ memory tab */
const checkLine = (c) => {
  const arg = Object.values(c.args)[0];
  const nice = String(arg).replace("$alerting", "the alerting service").replace("$caller", "its caller").replace("$target", "the datastore");
  const tgt = "the datastore";
  return humanCheck(c.tool, nice, c.measure, c.op, c.value, tgt).replace(/^\w/, (m) => m.toUpperCase());
};
function renderMemory() {
  const m = S.memory; if (!m) return;
  const pbs = m.playbooks;
  const act = pbs.filter((p) => p.status === "active").length;
  const planted = pbs.some((p) => p.signature.endsWith(":planted") && p.status === "active");
  const rows = pbs.map((p) => {
    const k = "pb:" + p.id, open = !!S.open[k];
    const tc = p.status === "retired" ? "#47474e" : p.trust >= .6 ? "var(--grn)" : "var(--t2)";
    const isNew = (S.inc && (p.learned_from || []).includes(S.inc.head.id));
    return `<tr class="main ${p.status}" data-pb="${esc(k)}">
      <td><div class="sig">${esc(p.signature)}</div><div class="desc">${esc(label(p.family))} on any ${esc(p.kind)} · ${plural(p.preconditions.length, "check")} to rule out first, then ${plural(p.steps.length, "expected reading")}</div></td>
      <td>${p.about.map((a) => `<span class="chipn ${p.kind !== "service" ? "db" : ""}">${esc(a)}</span>`).join(" ")}</td>
      <td class="mono" style="color:var(--t2)">${esc((p.learned_from || []).join(", ") || (p.source === "human" ? "planted" : "—"))}</td>
      <td style="white-space:nowrap"><span class="trustbar" style="margin:0 8px 0 0;width:90px"><i style="width:${Math.round(p.trust * 100)}%;background:${tc}"></i></span><span class="mono">${fmt(p.trust)}</span></td>
      <td class="mono" style="color:var(--t2)">${p.helped} · ${p.misled}</td>
      <td><span class="badge ${p.status === "retired" ? "" : isNew ? "acc" : ""}">${p.status === "retired" ? "Retired" : isNew ? "New" : "Active"}</span></td></tr>
      ${open ? `<tr><td colspan="6"><div class="rules"><b style="color:var(--t1);font-weight:500">Rule out first</b>${p.preconditions.map((c) => `<span>· ${esc(checkLine(c))}</span>`).join("") || "<span>· nothing</span>"}
        <b style="color:var(--t1);font-weight:500;margin-top:6px">Then expect</b>${p.steps.map((c) => `<span>· ${esc(checkLine(c))}</span>`).join("")}
        <span style="color:var(--t3);margin-top:6px">Stops at the first check that fails; the playbook is then "not applicable" and its trust is untouched.</span></div></td></tr>` : ""}`;
  }).join("");
  // preferences: the approved version, and the agent's reading it superseded
  const byId = Object.fromEntries(m.facts.map((f) => [f.id, f]));
  const current = m.facts.filter((f) => !f.valid_to);
  const facts = current.map((f) => {
    const old = (f.supersedes || []).map((id) => byId[id]).filter(Boolean);
    const val = `${f.predicate === "preferred_channel" ? "Notify by" : f.predicate === "wants_detail" ? "Include" : f.predicate.replace(/_/g, " ")} ${String(f.value).replace("_", " ")}${f.condition_family ? `, for ${label(f.condition_family)}` : ""}`;
    return `<div class="fact"><div class="key">${esc(f.handle)}.${esc(f.predicate)}</div>
      <div class="ver"><span class="badge mono">v${old.length + 1}</span>${f.source === "human" ? `<span class="badge grn">Approved by ${esc(f.approved_by)}</span>` : `<span class="badge">Agent's reading, unconfirmed</span>`}<span>incident ${esc(f.learned_in)}</span></div>
      <div class="val">${esc(val)}</div>
      <div class="src">Source message · ${esc(f.handle)} in the war room</div><div class="said">“${esc(f.said)}”</div>
      ${old.map((o) => `<div class="sup">SUPERSEDES</div><div class="ver" style="margin-top:0"><span class="badge mono">v1</span><span>Agent's reading, before the read-back</span></div>
        <div class="old">${esc(o.predicate)} = ${esc(o.value)}</div>`).join("")}</div>`;
  }).join("");
  const html = `<div class="cols"><section>
      <div class="sechead"><div class="grow"><h2>Playbooks</h2><p class="lead">What the agents remembered, pinned to the service where it happened. Click one to see its checks.</p></div>
        <span style="font-size:13px;color:var(--t3);margin-top:6px">${act} active · ${pbs.length - act} retired</span><button class="qbtn" data-q="memory" style="margin-top:4px">‹›</button></div>
      ${pbs.length ? `<table class="pb"><tr><th>Signature</th><th>Pinned to</th><th>Learned from</th><th>Trust</th><th>Helped · misled</th><th>Status</th></tr>${rows}</table>`
        : `<p class="lead">Nothing learned yet. Run s01: once the engineer confirms, the learner writes the first playbook.</p>`}
      <p class="foot">Trust starts at 0.50 and moves only on verdicts: helped (h+1)/(h+m+2). A playbook that misleads twice with trust under 0.5 retires and is never recalled again.</p>
      <div style="margin-top:20px;display:flex;gap:12px;align-items:center"><button class="btn" id="plant" ${planted ? "disabled" : ""}>Plant a deliberately wrong playbook</button>
        <span style="font-size:13px;color:var(--t3)">Claims any postgres over 30% of connections is saturated. Break redis-cache a few times and reject the wrong diagnosis: it misleads twice, then retires.</span></div>
    </section><section>
      <div class="sechead"><div class="grow"><h2>Engineer preferences</h2><p class="lead">Versioned facts. The engineer-approved version supersedes the agent's reading; both stay in the graph.</p></div><button class="qbtn" data-q="prefs" style="margin-top:4px">‹›</button></div>
      ${facts || `<p class="lead">None yet. In s01, tell the responder how you want database incidents handled.</p>`}
    </section></div>`;
  const v = $("#view-memory");
  if (v.dataset.sig === html) return;
  v.dataset.sig = html; v.innerHTML = html;
  v.querySelectorAll("[data-pb]").forEach((r) => r.onclick = () => { S.open[r.dataset.pb] = !S.open[r.dataset.pb]; renderMemory(); });
  $("#plant").onclick = async () => { await api("/api/plant-wrong-memory", {}); toast("A wrong playbook is planted on <b style='color:var(--t1)'>postgres-orders</b>."); await loadMemory(); };
  bindQ(v);
}

/* ------------------------------------------------------------ results tab */
async function renderResults() {
  const r = await api("/api/results");
  const ev = r.eval, v = $("#view-results");
  if (!ev) { v.innerHTML = `<h2>No results yet</h2><p class="lead">Run <span class="mono">make eval</span> and <span class="mono">make bench</span>.</p>`; return; }
  const A = ev.summary.A?.all, B = ev.summary.B?.all, C = ev.summary.C?.all;
  const req = (x) => Math.round(x.mean_llm_requests * x.n);
  const ok = (x) => Math.round(x.accuracy * x.n);
  const cut = A && req(A) ? Math.round((1 - req(C) / req(A)) * 100) : null;
  const COL = ["#3a3a40", "#6e6e76", "var(--acc)"];
  const chart = (title, sub, vals, max) => `<div class="cardx"><h5>${title}</h5><div class="s">${sub}</div><div class="bars">${vals.map((x, i) =>
    `<div><span style="${i === 2 ? "color:var(--t1)" : ""}">${x}</span><i style="height:${Math.max(2, x / max * 82)}%;background:${COL[i]};animation-delay:${i * .08}s"></i></div>`).join("")}</div></div>`;
  const m2 = ev.summary.m2, m5 = ev.m5;
  const rows5 = m5?.rows || [];
  const load = r.load || [];
  const dupBench = load.reduce((n, l) => n + l.duplicate_notifications, 0);
  const dup = [A, B, C].reduce((n, x) => n + (x?.duplicate_notifications || 0), 0) + dupBench;
  const best = load.reduce((a, l) => Math.max(a, l.incidents_per_minute), 0);
  const p95 = load.reduce((a, l) => Math.max(a, l.memory_writes.p95_ms), 0);
  v.innerHTML = `<div style="display:flex;align-items:center;gap:10px;color:var(--t3);font-size:13px;margin-bottom:24px">
      Benchmark · ${C.n} synthetic incidents · 3 memory arms, same model and tools · <span class="mono">${esc(ev.meta.model)}</span>
      <span class="grow"></span><span style="display:flex;gap:14px"><span><i style="display:inline-block;width:9px;height:9px;background:#3a3a40;margin-right:6px"></i>No memory</span>
      <span><i style="display:inline-block;width:9px;height:9px;background:#6e6e76;margin-right:6px"></i>Text memory</span><span><i style="display:inline-block;width:9px;height:9px;background:var(--acc);margin-right:6px"></i>Graph memory</span></span></div>
    <div class="res-grid"><section style="display:flex;flex-direction:column">
      ${cut !== null ? `<div class="hero">${cut}%</div><div class="hero-sub">fewer model calls</div>
      <p class="lead" style="font-size:16px;margin-top:18px;max-width:520px">Graph memory made <b style="color:var(--t1)">${req(C)}</b> model requests where no memory made <b style="color:var(--t1)">${req(A)}</b>, with ${ok(C) >= ok(A) ? "the same number of" : ""} correct diagnoses (${ok(C)} of ${C.n}).</p>`
        : `<div class="hero-sub">Rule-based run</div>`}
      <div class="grow"></div>
      <div style="display:flex;gap:48px;border-top:1px solid var(--line);padding-top:22px;margin-top:30px">
        <div class="stat"><b>${dup}</b><div>duplicate notifications,<br>including under randomly expired leases</div></div>
        <div class="stat"><b>${C.memory_helped}</b><small>of ${C.n}</small><div>solved straight from memory,<br>with no model call</div></div>
        ${m2 ? `<div class="stat"><b>${Math.round(m2.graph_recall_at_5 * 100)}%</b><div>right memory in the top 5,<br>text similarity: ${Math.round(m2.text_recall_at_5 * 100)}%</div></div>` : ""}
      </div></section>
    <section style="display:grid;gap:18px">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px">
        ${chart("Correct diagnoses", `out of ${C.n}`, [ok(A), ok(B), ok(C)], C.n)}
        ${chart("Model requests", "lower is better", [req(A), req(B), req(C)], Math.max(req(A), req(B), req(C), 1))}
        ${chart("Solved from memory", `no model call · out of ${C.n}`, [A.memory_helped, B.memory_helped, C.memory_helped], C.n)}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
        ${m2 ? `<div class="cardx"><h5>Right memory in the top 5 recalled</h5><div class="s">${m2.n} incidents where a playbook with the right answer existed</div>
          <div class="hb"><span>Text memory</span><span class="tr"><i style="width:${m2.text_recall_at_5 * 100}%;background:#6e6e76"></i></span><b>${Math.round(m2.text_recall_at_5 * 100)}%</b></div>
          <div class="hb"><span>Graph memory</span><span class="tr"><i style="width:${m2.graph_recall_at_5 * 100}%;background:var(--acc)"></i></span><b>${Math.round(m2.graph_recall_at_5 * 100)}%</b></div></div>` : ""}
        ${m5 ? `<div class="cardx"><h5>A wrong playbook retires itself</h5><div class="s">Deliberately planted, then used on incidents it doesn't fit</div>
          <div class="m5"><div><i></i>Planted<div class="o">trust 0.50</div></div>
            ${rows5.slice(0, 2).map((x, i) => `<div><i class="r"></i>Use ${i + 1} · misled<div class="o">trust ${fmt(x.wrong_playbook?.trust)}</div></div>`).join("")}
            <div><i class="x"></i>Retired<div class="o">${m5.correct_after_retirement ? "next incident correct" : "next incident wrong"}</div></div></div></div>` : ""}
      </div>
      ${load.length ? `<div class="cardx"><h5>Agents at once, two companies</h5><div class="s">Up to ${Math.round(best).toLocaleString()} incidents a minute; memory writes p95 ≤ ${p95} ms; ${dupBench} duplicate notifications</div>
        <table class="load"><tr><th>worker pairs</th><th>stalled workers</th><th>done</th><th>per min</th><th>read p50 / p95 ms</th><th>write p50 / p95 ms</th><th>duplicates</th><th>takeovers</th></tr>
        ${load.map((l) => `<tr><td>${l.worker_pairs_per_company}</td><td>${l.chaos_ms ? "lease expired every " + l.chaos_ms + " ms" : "none"}</td><td>${l.completed}/${l.incidents}</td><td>${Math.round(l.incidents_per_minute).toLocaleString()}</td>
          <td>${l.memory_reads.p50_ms} / ${l.memory_reads.p95_ms}</td><td>${l.memory_writes.p50_ms} / ${l.memory_writes.p95_ms}</td><td style="color:var(--grn)">${l.duplicate_notifications}</td><td>${l.takeovers}</td></tr>`).join("")}</table></div>` : ""}
    </section></div>
    <p class="foot">Run <span class="mono">${esc(ev.name)}</span>. Synthetic 15-node company, three failure families; the numbers describe this benchmark only. Rerun with <span class="mono">make eval</span> · <span class="mono">make bench</span> · <span class="mono">make isolation</span>.</p>`;
}
