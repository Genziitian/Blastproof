# Blast Radius local stack.
# Start the database:   docker compose up -d falkordb
# FalkorDB Browser:     http://localhost:3000
#
# Data lives in the named volume below (snapshots), so it survives `docker compose down`
# (but NOT `docker compose down -v`, which deletes volumes).
# Seeding is a separate command (python -m scripts.seed); nothing reseeds on startup.

services:
  falkordb:
    # FalkorDB 4.22.1 (Redis 8.10.2), pinned by digest: the exact image we tested.
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    ports:
      # Host port comes from FALKORDB_PORT in .env (default 6379). Use another port,
      # e.g. 6380, if a local Redis already listens on 6379.
      - "127.0.0.1:${FALKORDB_PORT:-6379}:6379"   # database (Redis protocol), this machine only
      - "127.0.0.1:3000:3000"   # FalkorDB Browser, this machine only
    environment:
      # RDB snapshots: every 30 s if anything changed, and always on shutdown
      # (`docker compose down` stops the container gracefully, so nothing is lost).
      # Not the append-only file: on FalkorDB 4.22.1 replaying a long AOF that
      # included graph deletes and re-creates diverged ("GRAPH.EFFECT references
      # label ... which doesn't match local schema state") and the server shut
      # itself down on every start. A snapshot is loaded directly, with no replay.
      # Trade-off: a hard crash of the database can lose up to 30 s of writes.
      REDIS_ARGS: "--appendonly no --save 30 1"
    stop_grace_period: 30s   # time to write the final snapshot
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped

volumes:
  falkordb_data:
